# Flavour defined in a separate file
flavors.arch = "arch.toml"

# Flavour defined in-place
[flavors.debian]
# The distribution to use
distribution = "debian"

# Apply to specific projects
when.path = [
  "~/src/apt",
  "~/src/debconf",
]

# The shell to use, defaults to bash if unset
shell = "zsh"

# Or with full options (defaults shown)
# [flavours.debian.shell]
# name = "zsh"
# zshrc = true
# zprofile = false
# zshenv = false
#
# Available options per shell (defaults shown)
# bash:   bashrc = true, bash_profile = false, profile = false
# zsh:    zshrc = true, zprofile = false, zshenv = false
# fish:   config = true, functions = false, conf_d = false
# ksh:    kshrc = true, profile = false
# elvish: rc = true, lib = false
# tcsh:   tcshrc = true, login = false

# Optional user definition, mirrors the calling user if unset
# [flavours.debian.user]
# name = "raniz"
# uid = 1000

# Except groups, which defaults to just a group with the same name as the user
# extra_groups = []

# [flavours.debian.user.group]
# name = "raniz"
# gid = 1000

# The base layer, this layer always exists and is always applied as the lowest layer
[flavours.debian.layers.base]
packages = [
  "neovim",
  "starship",
  "dprint",
  "aur:antigen",
]

# Agent definitions, `ask agent` will launch the first agent in the list
# to launch another agent call `ask agent <name>`
agents = [
  # Can be the name of the agent, which sets default options
  "claude",
  # Or with full options (defaults shown)
  # { name: "claude", claude_md: true, auth: true, skills: true, config: true },
  # { name: "opencode", agents_md: true, auth: true, skills: true, config: true },
  # { name: "codex", agents_md: true, auth: true, skills: true, config: true },
  # { name: "pi", system_md: true, auth: true, skills: true, config: true },
]

ides = [
  "jetbrains-idea",
  "vscode",
]

[flavours.debian.layers.python]
# If multiple layers are applied, ordering _may_ be important
# defaults to 0
order = 10
when.files = ["pyproject.toml"]

packages = [
  "python",
  "uv",
  "ipython3",
]

agents

ides = [
    "jetbrains-pycharm",
    # IDEs in lower layers can be removed
    "-vscode",
]

bind_mounts = [
  "~/.cache/uv",
]
