# The distribution to use
distribution = "debian"

# Apply to specific projects
when.path = [
  "~/src/apt",
  "~/src/debconf",
]

# The shell to use, defaults to bash if unset
shell = "zsh"

# Or with full options (defaults shown)
# [shell]
# name = "zsh"
# zshrc = true
# zprofile = false
# zshenv = false
#
# Available options per shell (defaults shown)
# bash:   bashrc = true, bash_profile = false, profile = false
# zsh:    zshrc = true, zprofile = false, zshenv = false
# fish:   config = true, functions = false, conf_d = false
# ksh:    kshrc = true, profile = false
# elvish: rc = true, lib = false
# tcsh:   tcshrc = true, login = false

# Optional user definition, mirrors the calling user if unset
# [user]
# name = "raniz"
# uid = 1000

# Except groups, which defaults to just a group with the same name as the user
# extra_groups = []

# [user.group]
# name = "raniz"
# gid = 1000

# The base layer, this layer always exists and is always applied as the lowest layer
[layers.base]
packages = [
  "openssh-server",
  "neovim",
  "starship",
  "dprint",
]

bind_mounts = [
  # NeoVim configuration
  "~/.config/nvim",
  "~/.local/share/nvim",
]

# Custom pyinfra taskfiles to run last during converge, relative to this file
# taskfiles = [
#   "tasks/provision.py",
# ]

# systemd Services to enable
services."sshd.service" = "enabled"
services."man-db.timer" = "enabled"

# Agent definitions, `ask agent` will launch the first agent in the list.
# To launch another agent call `ask agent <name>`
[layers.base.agents]
default = "pi"
# Can be just true to set default options
pi = true

# Environment variables can be set for agents specifically
# env.GIT_COMMITTER_NAME = "My autonumous agent"
# env.GIT_COMMITTER_EMAIL = "agent@mydomain.com"
# env.GIT_AUTHOR_NAME = "My autonumous agent"
# env.GIT_AUTHOR_EMAIL = "agent@mydomain.com"

# Or with full options (defaults shown)
# claude = { claude_md: true, auth: true, skills: true, config: true }
# opencode = { agents_md: true, auth: true, skills: true, config: true }
# codex = { agents_md: true, auth: true, skills: true, config: true }

# [layers.base.agents.pi]
# system_md = true
# auth = true
# skills = true
# config = true
# extensions = [
#   "npm:pi-subagents",
# ]

[layers.python]
# If multiple layers are applied, ordering _may_ be important.
# Defaults to 0. Layers with equal order are applied in an unspecified order which may not be stable
order = 10
when.files = ["pyproject.toml"]

packages = [
  "python",
  "uv",
  "ipython3",
]

ides = [
  "pycharm",
]

bind_mounts = [
  "~/.cache/uv",
]
