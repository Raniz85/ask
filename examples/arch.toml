default = true
distribution = "arch"
shell = "zsh"

[layers.base]
packages = [
  "openssh",
  "neovim",
  "starship",
  "dprint",
  "aur:antigen",
]

services."sshd.service" = "enabled"
services."man-db.timer" = "enabled"

agents = [
  "claude",
  "pi",
  "opencode",
]

[layers.python]
when.files = ["pyproject.toml"]

packages = [
  "python",
  "uv",
  "ipython",
]

ide = "jetbrains-idea"

bind_mounts = [
  "~/.cache/uv",
]
