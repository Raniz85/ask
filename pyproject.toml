[project]
name = "ask"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "cyclopts>=5.3.3",
  "pyinfra>=3.10.0",
  "pyinfrincus>=0.8.1",
]

