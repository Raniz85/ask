[project]
name = "ask"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "cyclopts>=5.3.3",
  "pydantic>=2.14.3",
  "pyinfra>=3.10.0",
  "pyinfrincus>=0.8.1",
  "rich>=15.0.0",
]

[project.scripts]
ask = "ask:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy>=1.11.0",
  "pytest>=9.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not vm'"
markers = ["vm: end-to-end tests that run Ask in an Incus VM"]
