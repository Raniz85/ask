name: Package

on:
  push:
    tags:
      - "v*"
    branches:
      - "workflow-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    name: Build .deb for ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            slug: debian-12
          - image: debian:13
            slug: debian-13
          - image: debian:sid
            slug: debian-sid
          - image: ubuntu:24.04
            slug: ubuntu-24.04
          - image: ubuntu:24.10
            slug: ubuntu-24.10
          - image: ubuntu:25.04
            slug: ubuntu-25.04
          - image: ubuntu:25.10
            slug: ubuntu-25.10
          - image: ubuntu:26.04
            slug: ubuntu-26.04
          - image: ubuntu:26.10
            slug: ubuntu-26.10
    # Build inside the target distribution so bundled wheels match its glibc
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install python >= 3.13, uv and curl
        run: |
          apt-get update
          apt-get install -y curl ca-certificates
          # 24.10 is EOL and only served from old-releases
          if [ "${{ matrix.image }}" = "ubuntu:24.10" ]; then
            sed -i 's|archive.ubuntu.com|old-releases.ubuntu.com|g; s|security.ubuntu.com|old-releases.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
            apt-get update
          fi
          PY=$(ls /usr/bin/python3.[0-9]* 2>/dev/null | grep -v -- -config | sort -V | tail -1)
          if [ -z "$PY" ] || [ "$(basename "$PY" | cut -d. -f2)" -lt 13 ]; then
            case "${{ matrix.image }}" in
              ubuntu-*) apt-get install -y software-properties-common && add-apt-repository -y ppa:deadsnakes/ppa ;;
              debian:12) echo 'deb http://deb.debian.org/debian bookworm-backports main' > /etc/apt/sources.list.d/bookworm-backports.list ;;
            esac
            apt-get update
            apt-get install -y python3.13 python3.13-venv
            PY=/usr/bin/python3.13
          fi
          apt-get install -y "$(basename "$PY")-venv"
          echo "PYBIN=$PY" >> "$GITHUB_ENV"
          curl -LsSf https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /tmp
          install -m 0755 /tmp/uv-*/uv /usr/local/bin/uv

      # The target python version is whatever the target distribution ships
      - name: Detect target python version
        id: python
        run: |
          MINOR=$("$PYBIN" -c 'import sys; print(sys.version_info.minor)')
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          "$PYBIN" --version

      # Build the venv at its final path /opt/ask so entry-point shebangs
      # point at /opt/ask/bin/python on the target host
      - name: Create venv at /opt/ask and install package
        run: |
          "$PYBIN" -m venv /opt/ask
          uv pip install --python /opt/ask/bin/python .

      - name: Read package version
        id: version
        run: |
          echo "version=$("$PYBIN" -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Build .deb with nfpm
        run: |
          # Resolve latest release via redirect; the API is unauthenticated and rate-limited on shared runners
          NFPM_VERSION=$(curl -sIL -o /dev/null -w '%{url_effective}' https://github.com/goreleaser/nfpm/releases/latest | grep -oP '/tag/v\K[0-9.]+' || true)
          test -n "$NFPM_VERSION" || { echo "could not resolve latest nfpm version" >&2; exit 1; }
          curl -sL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | tar -xz -C /tmp
          install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          VERSION=${{ steps.version.outputs.version }}
          cat > nfpm.yaml <<EOF
          name: ask
          version: "$VERSION"
          arch: amd64
          maintainer: Daniel Raniz Raneland <raniz@raneland.se>
          description: Persistent containers for projects
          license: MIT
          homepage: https://github.com/raniz85/ask
          depends:
            - "python3.${{ steps.python.outputs.minor }}"
          contents:
            - src: /opt/ask
              dst: /opt/ask
            - src: /opt/ask/bin/ask
              dst: /usr/bin/ask
              type: symlink
          EOF
          nfpm pkg --packager deb --target "ask_${VERSION}_amd64.deb" --config nfpm.yaml

      - name: Verify package
        run: |
          apt-get install -y dpkg
          dpkg-deb --info ask_*_amd64.deb

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ask-${{ steps.version.outputs.version }}-deb-${{ matrix.slug }}
          path: ask_*_amd64.deb
