name: Package

on:
  push:
    tags:
      - "v*"
    branches:
      - "workflow-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build ${{ matrix.distro }} (${{ matrix.arch.name }})
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian:12
          - debian:13
          - debian:sid
          - ubuntu:24.04
          - ubuntu:24.10
          - ubuntu:25.04
          - ubuntu:25.10
          - ubuntu:26.04
          - ubuntu:26.10
          - fedora:45
          - fedora:46
          - fedora:rawhide
          - rockylinux:9
          - almalinux:9
          - opensuse/leap:16.0
          - opensuse/tumbleweed
          - archlinux:latest
        arch:
          - { name: x86_64, slug_suffix: "", runner: ubuntu-latest, host_arch: x86_64 }
          - { name: aarch64, slug_suffix: -aarch64, runner: ubuntu-24.04-arm, host_arch: aarch64 }
        exclude:
          # EOL 24.10 ports archive is not mirrored to old-releases
          - distro: ubuntu:24.10
            arch: { name: aarch64 }
          # Arch Linux ARM is a separate project
          - distro: archlinux:latest
            arch: { name: aarch64 }
    # Build inside the target distribution so bundled wheels match its libc
    container: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive slug and package extension
        id: pkg
        run: |
          SLUG=$(echo "${{ matrix.distro }}" | tr '/:' '--' | sed 's/-latest$//')
          case "${{ matrix.distro }}" in
            debian:*|ubuntu:*) PACKAGER=deb ;;
            archlinux:*) PACKAGER=archlinux ;;
            *) PACKAGER=rpm ;;
          esac
          case "$PACKAGER" in
            archlinux) EXT=pkg.tar.zst ;;
            *) EXT=$PACKAGER ;;
          esac
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "packager=$PACKAGER" >> "$GITHUB_OUTPUT"
          echo "ext=$EXT" >> "$GITHUB_OUTPUT"

      - name: Install uv and curl
        run: |
          case "${{ matrix.distro }}" in
            fedora:*)
              dnf install -y curl ca-certificates
              ;;
            rockylinux:*|almalinux:*)
              dnf install -y ca-certificates  # curl-minimal already provides curl
              ;;
            opensuse/*)
              zypper install -y curl ca-certificates
              ;;
            archlinux:*)
              pacman -Sy --noconfirm curl ca-certificates
              ;;
            ubuntu:24.10)
              # 24.10 is EOL and only served from old-releases; fix sources before apt-get update
              sed -i 's|archive.ubuntu.com|old-releases.ubuntu.com|g; s|security.ubuntu.com|old-releases.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
              apt-get update
              apt-get install -y curl ca-certificates
              ;;
            *)
              apt-get update
              apt-get install -y curl ca-certificates
              ;;
          esac
          curl -LsSf "https://github.com/astral-sh/uv/releases/latest/download/uv-${{ matrix.arch.host_arch }}-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /tmp
          install -m 0755 /tmp/uv-*/uv /usr/local/bin/uv

      # Bundle a standalone python at the final path /opt/ask so entry-point
      # shebangs point at /opt/ask/bin/python3.13 on the target host; no
      # system python dependency
      - name: Bundle python 3.13 at /opt/ask and install package
        run: |
          uv python install 3.13
          cp -a "$(dirname "$(uv python find 3.13)")/.." /opt/ask
          uv pip install --python /opt/ask/bin/python3.13 --break-system-packages .

      - name: Read package version
        id: version
        run: |
          echo "version=$(/opt/ask/bin/python3.13 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Build package with nfpm
        run: |
          # Resolve latest release via redirect; the API is unauthenticated and rate-limited on shared runners
          NFPM_VERSION=$(curl -sIL -o /dev/null -w '%{url_effective}' https://github.com/goreleaser/nfpm/releases/latest | grep -oP '/tag/v\K[0-9.]+' || true)
          test -n "$NFPM_VERSION" || { echo "could not resolve latest nfpm version" >&2; exit 1; }
          NFPM_ASSET_ARCH=$([ "${{ matrix.arch.host_arch }}" = aarch64 ] && echo arm64 || echo x86_64)
          curl -sL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${NFPM_ASSET_ARCH}.tar.gz" | tar -xz -C /tmp
          install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          # deb names arm64 "arm64", rpm/archlinux call it "aarch64"
          case "${{ steps.pkg.outputs.packager }}:${{ matrix.arch.name }}" in
            deb:x86_64) NFPM_ARCH=amd64 ;;
            deb:aarch64) NFPM_ARCH=arm64 ;;
            *) NFPM_ARCH=${{ matrix.arch.name }} ;;
          esac
          VERSION=${{ steps.version.outputs.version }}
          cat > nfpm.yaml <<EOF
          name: ask
          version: "$VERSION"
          arch: "$NFPM_ARCH"
          maintainer: Daniel Raniz Raneland <raniz@raneland.se>
          description: Persistent containers for projects
          license: MIT
          homepage: https://github.com/raniz85/ask
          contents:
            - src: /opt/ask
              dst: /opt/ask
            - src: /opt/ask/bin/ask
              dst: /usr/bin/ask
              type: symlink
          EOF
          nfpm pkg --packager ${{ steps.pkg.outputs.packager }} --target "ask_${VERSION}_${NFPM_ARCH}.${{ steps.pkg.outputs.ext }}" --config nfpm.yaml

      - name: Verify package
        run: |
          case "${{ steps.pkg.outputs.packager }}" in
            deb) dpkg-deb --info ask_*.${{ steps.pkg.outputs.ext }} ;;
            rpm) rpm -qip ask_*.${{ steps.pkg.outputs.ext }} ;;
            archlinux) pacman -Qip ask_*.${{ steps.pkg.outputs.ext }} ;;
          esac

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ask-${{ steps.version.outputs.version }}-${{ steps.pkg.outputs.slug }}${{ matrix.arch.slug_suffix }}
          path: ask_*.${{ steps.pkg.outputs.ext }}
