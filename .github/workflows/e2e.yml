name: E2E

on:
  push:
    branches:
      - main
      - "workflow-*"

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end tests in an Incus VM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable nested virtualization
        run: |
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          test -w /dev/kvm

      - name: Install Incus
        run: |
          curl -fsSL https://pkgs.zabbly.com/key.asc \
            | sudo gpg --dearmor -o /etc/apt/keyrings/zabbly-incus.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/zabbly-incus.gpg] https://pkgs.zabbly.com/incus/stable ${VERSION_CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/zabbly-incus.list
          sudo apt-get update
          sudo apt-get install -y incus

      - name: Start Incus
        run: |
          sudo systemctl enable --now incus.service incus.socket
          sudo incus admin init --minimal
          # --minimal creates no network, leaving VMs without connectivity
          sudo incus network create incusbr0 2>/dev/null || true
          sudo incus profile device remove default eth0 2>/dev/null || true
          sudo incus profile device add default eth0 nic nictype=bridged parent=incusbr0
          # The tests invoke incus as the runner user, not via sudo
          sudo usermod -aG incus-admin "$USER"
          sudo chmod 666 /var/lib/incus/unix.socket
          sudo rm -rf "/home/$USER/.config/incus"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Smoke-test launching a VM
        run: |
          incus network list
          incus profile show default
          incus launch images:archlinux/current/cloud ask-e2e-smoke --vm \
            --config security.secureboot=false || true
          for i in $(seq 1 60); do
            incus exec ask-e2e-smoke -- true 2>/dev/null && break
            sleep 5
          done
          incus exec ask-e2e-smoke -- ip addr || true
          incus exec ask-e2e-smoke -- ping -c1 -W3 1.1.1.1 || true
          incus delete --force ask-e2e-smoke || true

      - name: Run the E2E tests
        run: "$HOME/.local/bin/uv run pytest -m vm -v tests/vm"
