name: E2E

on:
  push:
    branches:
      - main
      - "workflow-*"

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end tests (${{ matrix.distribution }}) on the runner host
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - arch
          - debian
    steps:
      - uses: actions/checkout@v4

      - name: Install Incus
        run: |
          curl -fsSL https://pkgs.zabbly.com/key.asc \
            | sudo gpg --dearmor -o /etc/apt/keyrings/zabbly-incus.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/zabbly-incus.gpg] https://pkgs.zabbly.com/incus/stable ${VERSION_CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/zabbly-incus.list
          sudo apt-get update
          sudo apt-get install -y incus dnsmasq

      # Rootless Incus containers need unprivileged user namespaces, which
      # Ubuntu 24.04 restricts via AppArmor by default
      - name: Allow unprivileged user namespaces
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install uv
        run: |
          curl -LsSf https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /tmp
          sudo install -m 0755 /tmp/uv-*/uv /usr/local/bin/uv

      - name: Run the E2E tests
        env:
          # The runner is already ephemeral, so run the tests directly on the
          # host instead of launching a temporary VM
          ASK_E2E_HOST: "1"
          ASK_E2E_DISTRIBUTION: ${{ matrix.distribution }}
        run: uv run pytest -m vm -v tests/vm
